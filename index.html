<!DOCTYPE html>

<html>

<head>

    <title>Our Shared TBR 📚</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Our Shared TBR 📚</h1>

    <p id="book-count"></p>

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search by title or author..."
        >

        <button id="sort-title">
            Sort by Title
        </button>

        <button id="sort-author">
            Sort by Author
        </button>

        <button id="random-pick">
            Pick Our Next Read 🎲
        </button>

    </div>

    <div id="random-result"></div>

    <div id="books"></div>

    <script src="script.js"></script>

</body>

</html>
